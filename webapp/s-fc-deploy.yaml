# bookmadebook · 阿里云 FC 3.0 部署配置（Serverless Devs v3）
# 代码目录 deploy/（自包含：index.mjs + worker.js + store-ots.mjs + public/ + node_modules）
# 部署：在 webapp/ 根执行 s deploy -y
# ⚠️ AK 等敏感变量不写本文件——deploy 后由 008 注入环境变量
edition: 3.0.0
name: bookmadebook
access: "default"

resources:
  bookmadebook-api:
    component: fc3
    props:
      region: cn-hongkong          # 中国香港：自定义域名免 ICP 备案
      functionName: bookmadebook-api
      description: bookmadebook 自助点书（API + public 静态托管）
      runtime: nodejs20
      handler: index.handler       # deploy/index.mjs 具名导出 handler
      memorySize: 512
      cpu: 0.5
      diskSize: 512               # FC3 合法值：512 或 10240 倍数
      timeout: 30
      code: ./deploy               # 上传 deploy/（自包含）
      environmentVariables:
        MOCK_PAY: "0"
        DAEMON_TOKEN: "bm-dmn-2026-0905-a7f3k9qz2x"  # 占位；008 部署后覆盖
        TABLESTORE_ENDPOINT: "https://bookmadebook.cn-hongkong.ots.aliyuncs.com"
        TABLESTORE_INSTANCE: "bookmadebook"
        # ⚠️ TABLESTORE_AK_ID/SECRET 已注入 FC 环境变量（控制台可见）；
        #    本文件不保留明文——重部署前需从 FC 现有配置复制或重新注入
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            methods: [GET, POST, PATCH, OPTIONS, HEAD]
            disableURLInternet: false
