# ============================================================
# bookmadebook 全局配置文件
# 路径：bookmadebook/config.yaml
# ============================================================
# 说明：
#   - 【常用】标记的项：用户会经常调整
#   - 【高级】标记的项：一般不用改，保持默认即可
# ============================================================

# === 【常用】基础参数 ===
age_group:
  default: adult          # 默认年龄段：toddler|preschool|primary_lower|primary_upper|middle_school|high_school|adult

scene:
  default: commute        # 默认场景：commute|running|bedtime|parent_child|deep_learning|lunch_break

depth:
  default: standard       # 默认深度：quick|standard|deep|full
  auto_constrain: true    # 是否按年龄段自动限制可选深度（如toddler只支持standard）

voice:
  default: auto           # auto=按年龄段自动选，或指定声音名
  # 可选声音：xiaoshuang|xiaoxiao|yunxi|yunjian|yunyang
  # 或完整voice名：zh-CN-XiaoxiaoNeural 等

speed:
  default: auto           # auto=按年龄段自动设，或指定 0.8~1.5

# === 【常用】交付与输出 ===
delivery:
  output_dir: "~/bookmadebook"        # 输出目录
  default_channel: local             # local|obsidian|feishu
  output_format: audio               # audio|script|both
  keep_intermediates: false          # 是否保留中间文件

delivery_mode:
  mode: progressive                  # progressive=边写边出 | full=一次性出完整
  progressive:
    first_chapter_timeout: 30        # 首段最大等待秒数
    notify_on_complete: true         # 全部完成后通知
  full:
    max_wait_minutes: 60             # 最大等待分钟

# === 【常用】内容安全 ===
content_safety:
  mode: auto                         # auto=按age_group自动|kids=严格|adult=宽松
  # auto映射：0-18岁→kids严格模式，18+→adult宽松模式

# === 【高级】年龄段详细参数 ===
# 每个年龄段的核心参数表（脚本层直接读取，一般不用改，改 default 即可）
# 字段：max_dur=最大时长(分钟), depths=支持深度, chars=句子最大字数
#       prompt=提示词模板, voice=声音, rate=语速, filter=过滤级别
#       guidance=加家长指引, categories=推荐类别
age_group_levels:
  toddler: {name: "婴幼儿", age_range: "0-3岁", max_dur: 5, depths: [], chars: 8, prompt: "prompts/children/toddler_mode.txt", voice: "zh-CN-XiaoshuangNeural", rate: "-20%", filter: strict, guidance: true, categories: [童话故事, 动物故事, 韵律儿歌]}
  preschool: {name: "学龄前", age_range: "3-6岁", max_dur: 8, depths: [], chars: 12, prompt: "prompts/children/preschool_mode.txt", voice: "zh-CN-XiaoxiaoNeural", rate: "-15%", filter: strict, guidance: true, categories: [童话故事, 动物故事, 科学启蒙, 成长励志]}
  primary_lower: {name: "小学低年级", age_range: "6-9岁", max_dur: 12, depths: [quick, standard, deep], chars: 20, prompt: "prompts/children/primary_lower_mode.txt", voice: "zh-CN-XiaoxiaoNeural", rate: "-10%", filter: moderate, guidance: true, categories: [童话故事, 动物故事, 科学启蒙, 历史人文, 成长励志, 文学经典]}
  primary_upper: {name: "小学高年级", age_range: "9-12岁", max_dur: 15, depths: [quick, standard, deep], chars: 30, prompt: "prompts/children/primary_upper_mode.txt", voice: "zh-CN-YunxiNeural", rate: "-5%", filter: moderate, guidance: false, categories: [动物故事, 科学启蒙, 历史人文, 成长励志, 文学经典]}
  middle_school: {name: "初中", age_range: "12-15岁", max_dur: 18, depths: [quick, standard, deep, full], prompt: "prompts/teen/middle_school_mode.txt", voice: "zh-CN-YunjianNeural", rate: "+0%", filter: light, guidance: false, categories: all}
  high_school: {name: "高中", age_range: "15-18岁", max_dur: 25, depths: [quick, standard, deep, full], prompt: "prompts/teen/high_school_mode.txt", voice: "zh-CN-YunyangNeural", rate: "+0%", filter: light, guidance: false, categories: all}
  adult: {name: "成人", age_range: "18+", max_dur: 30, depths: [quick, standard, deep, full], prompt: "", voice: "zh-CN-XiaoxiaoNeural", rate: "+0%", filter: "off", guidance: false, categories: all}

# === 【高级】场景预设 ===
# 场景影响：语速、风格、BGM、段间间隔（一般不用改，改 default 即可）
scene_presets:
  commute: {name: "通勤路上", max_dur: 15, speed: "+5%", style: "信息密度高，开场直接进入主题", bgm: false}
  running: {name: "跑步/运动", max_dur: 8, speed: "+10%", style: "节奏感强，金句密集，每段短小精悍", bgm: true, bgm_style: "动感"}
  bedtime: {name: "睡前听", max_dur: 12, speed: "-15%", style: "语速舒缓，语气温柔，结尾有总结安抚", bgm: true, bgm_style: "轻音乐"}
  parent_child: {name: "亲子共听", max_dur: 10, speed: "-10%", style: "互动性强，有提问有回答，适合家长和孩子一起听", bgm: false}
  deep_learning: {name: "深度学习", max_dur: 30, speed: "+0%", style: "逐章精讲，有论据有案例有批判性思考", bgm: false}
  lunch_break: {name: "午休碎片", max_dur: 8, speed: "+0%", style: "轻量精华，一个核心观点+一个案例", bgm: false}

# === 【高级】TTS 引擎 ===
tts:
  default_engine: "edge-tts"         # edge-tts|openai|azure|elevenlabs
  edge_tts:                          # 默认引擎，免费，无需API Key
    segment_max_chars: 500           # 每段最大字符数
    gap_between_segments_ms: 400     # 段间停顿
  # openai:                          # 需设置 OPENAI_API_KEY 环境变量
  #   model: tts-1-hd
  #   voice: nova
  # azure:                           # 需设置 AZURE_TTS_KEY 环境变量
  #   region: eastasia
  # elevenlabs:                      # 需设置 ELEVENLABS_API_KEY 环境变量
  #   voice: 21m00Tcm4TlvDq8ikWAM

# === 【高级】声音克隆（免费方案）===
voice_clone:
  enabled: false                     # 是否启用（用户说"用我的声音"时开启）
  engine: gpt_sovits                 # gpt_sovits=免费|elevenlabs=付费
  gpt_sovits:
    endpoint: "https://sovits.cn/api"
    sample_seconds: 20               # 需用户录制20秒语音样本

# === 【高级】书籍获取（合规版：公开信息→公版→用户提供）===
acquisition:
  timeout_seconds: 60                # 全局超时
  sources_priority:                  # 获取优先级（全部合法）
    - douban                         # 豆瓣公开信息（简介/评分，无需API）
    - wikipedia                      # 维基百科（作者背景/作品概述）
    - gutenberg                      # 古登堡计划（仅公版书，作者逝世超50年）
    - user_provided                  # 用户上传正版电子书/粘贴文本/URL
  # 注意：已移除影子图书馆（安娜的档案等），精读=种草引流（非盗版替代）
  douban:
    timeout: 15                      # 豆瓣单源超时（秒）
  wikipedia:
    timeout: 15
  gutenberg:
    endpoint: "https://www.gutenberg.org/ebooks/search/"

# === 【高级】脚本生成 ===
script_generation:
  llm:
    temperature: 0.6
    max_tokens: 4096
  chapter_summary:
    max_chapter_words: 200

# === 【高级】音频后处理 ===
post_processing:
  loudness:
    target: -16                      # 目标响度(LUFS)
    true_peak: -1.5
  background_music:
    enabled: false                   # 是否默认加BGM
    volume_db: -25

# === 【高级】推荐系统 ===
recommendation:
  max_results: 5
  highlight_methods: [llm_knowledge, weread_highlights, douban_reviews]
  trial_audio_seconds: 15

# === 【高级】笔记输出 ===
notes:
  enabled: true
  auto_save: true
  formats: [obsidian_markdown, text_summary]
  obsidian:
    vault_path_env: "OBSIDIAN_VAULT_PATH"
    notes_dir: "Book Notes/精读笔记"
